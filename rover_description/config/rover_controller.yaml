controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_front_joint", "left_mid_joint", "left_back_joint"]
    right_wheel_names: ["right_front_joint", "right_mid_joint", "right_back_joint"]
    right_wheel_radius_multiplier: -1.0
    wheel_separation: 0.52
    wheel_radius: 0.1
    publish_limited_velocity: true

    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: true
    linear.x.max_acceleration: 0.5
    linear.x.min_acceleration: -0.5
    linear.x.max_jerk: 2.0
    linear.x.min_jerk: -2.0

    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: true
    angular.z.max_acceleration: 1.5
    angular.z.min_acceleration: -1.5
    angular.z.max_jerk: 6.0
    angular.z.min_jerk: -6.0

    base_frame_id: chassis
    odom_frame_id: odom

    publish_rate: 50.0
    cmd_vel_timeout: 0.5

    use_stamped_vel: false

joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - left_hub_joint
      - right_hub_joint
